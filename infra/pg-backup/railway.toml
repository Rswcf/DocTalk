# Railway service `pg-backup`: a run-to-completion job, deployed with
#   railway up infra/pg-backup --path-as-root -s pg-backup -e production
# from the main checkout. See README.md.
#
# NOTE: Railway does NOT read this file for such directory uploads (the
# deployment's fileServiceManifest is empty). The live values below were set
# on the service instance with the GraphQL serviceInstanceUpdate mutation and
# must be changed there; this file records them. Read them back with
# serviceInstance { cronSchedule restartPolicyType restartPolicyMaxRetries }.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# No healthcheck: there is no server. One retry covers private-DNS warm-up and
# transient R2 errors; every run writes new, unique keys, so a retry is safe.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 1
# Nightly at 09:15 UTC (live value set on the service instance).
cronSchedule = "15 9 * * *"

# Same region as Postgres (see CLAUDE.md "Railway auto region placement drifts").
[deploy.multiRegionConfig.us-west2]
numReplicas = 1
