name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python ../scripts/check_version_consistency.py
      - run: ruff check app/ tests/
      - run: python -m pytest tests/test_smoke.py tests/test_parse_service.py tests/test_proxy_ip_verification.py -v
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres

  integration:
    # The whole integration suite in ONE pytest process, on purpose: run file
    # by file it hid 52 of 136 failures (pytest-asyncio 0.24; see
    # backend/requirements-dev.txt). Includes tests/test_migrations.py, which
    # catches broken alembic downgrade() paths that would silently make
    # production rollback impossible.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: doctalk_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      # test_smoke.py's document upload writes to MinIO. A service container
      # cannot take a command and minio/minio needs `server /data`, so it
      # starts here, on the same image docker-compose.yml pins.
      - run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:RELEASE.2024-12-18T13-15-44Z server /data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # The app creates its bucket in the lifespan hook, which the tests'
      # httpx.ASGITransport never runs. --retry-all-errors, because while
      # MinIO boots docker's port proxy answers with an empty reply, not a
      # refused connection.
      - run: |
          curl -fsS --retry 30 --retry-all-errors --retry-delay 1 http://localhost:9000/minio/health/live
          python -c "from app.services.storage_service import storage_service; storage_service.ensure_bucket()"
      - run: python -m pytest -m integration -v
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/doctalk_ci
          # conftest.py defaults SKIP_INTEGRATION=1 so integration tests skip
          # locally; this job has real services and must run them.
          SKIP_INTEGRATION: "0"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # pdftotext (poppler) backs tests/landing-night.test.cjs's check that the
      # hero's document text is verbatim from backend/seed_data.
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: npm run test:unit
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE: http://localhost:8000

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t doctalk-test -f backend/Dockerfile .
