name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      # WeasyPrint (PDF export) needs Pango at runtime; the backend image
      # installs it too.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - run: pip install -r requirements-dev.txt
      - run: python ../scripts/check_version_consistency.py
      - run: ruff check app/ tests/
      # The whole unit suite. It needs no services (checked with every service
      # pointed at a dead port); tests marked integration skip here and run in
      # the integration job.
      - run: python -m pytest -q
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres

  integration:
    # The whole integration suite in ONE pytest process, on purpose: run file
    # by file it hid 52 of 136 failures (pytest-asyncio 0.24; see
    # backend/requirements-dev.txt). Includes tests/test_migrations.py, which
    # catches broken alembic downgrade() paths that would silently make
    # production rollback impossible.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: doctalk_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # test_smoke.py's document upload writes to MinIO. minio/minio is gone
      # from Docker Hub and Quay (and dl.min.io answers 410), so this is
      # Bitnami's frozen build of the release docker-compose.yml pins
      # (RELEASE.2024-12-18T13-15-44Z), pinned by digest.
      minio:
        image: bitnamilegacy/minio:2024.12.18@sha256:c0ede65eb88e47138470202c517bacf55ab3c27df848030b7b46e69d34b7d192
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -fsS http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # The app creates its bucket in the lifespan hook, which the tests'
      # httpx.ASGITransport never runs.
      - run: python -c "from app.services.storage_service import storage_service; storage_service.ensure_bucket()"
      - run: python -m pytest -m integration -v
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/doctalk_ci
          # conftest.py defaults SKIP_INTEGRATION=1 so integration tests skip
          # locally; this job has real services and must run them.
          SKIP_INTEGRATION: "0"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # pdftotext (poppler) backs tests/landing-night.test.cjs's check that the
      # hero's document text is verbatim from backend/seed_data.
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: npm run test:unit
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE: http://localhost:8000

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t doctalk-test -f backend/Dockerfile .
      # Nightly Postgres backup job (infra/pg-backup): lint the script, build
      # the image, and check it ships the tools backup.sh needs, including a
      # pg_dump whose major matches production (17).
      - run: shellcheck infra/pg-backup/backup.sh
      - run: docker build -t doctalk-pg-backup infra/pg-backup
      - run: |
          docker run --rm doctalk-pg-backup sh -c \
            'pg_dump --version | grep -q "PostgreSQL) 17\." && age --version && rclone version >/dev/null && jq --version && curl --version >/dev/null'
