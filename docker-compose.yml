version: '3.9'

services:
  postgres:
    # Pinned to patch: avoids silent major/minor drift that could break
    # local dev after a docker-compose pull. Bump deliberately.
    image: postgres:16.6
    container_name: doctalk-postgres
    environment:
      POSTGRES_DB: doctalk
      POSTGRES_USER: doctalk
      POSTGRES_PASSWORD: doctalk
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  qdrant:
    # Must stay within qdrant-client's 3-minor support window. Current client
    # is 1.16.1 (backend/requirements.txt) so server 1.13–1.16 is safe. Prod
    # uses Railway's managed Qdrant service; this compose image is dev only.
    image: qdrant/qdrant:v1.14.1
    container_name: doctalk-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:7.4.1-alpine
    container_name: doctalk-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    # The official minio/minio image can no longer be pulled (Docker Hub
    # repository deleted, dl.min.io answers 410). This is Bitnami's frozen
    # build of the same release, RELEASE.2024-12-18T13-15-44Z, pinned by
    # digest; CI's integration job runs the same image. It serves the
    # console on :9001 by default and keeps data in /bitnami/minio/data.
    image: bitnamilegacy/minio:2024.12.18@sha256:c0ede65eb88e47138470202c517bacf55ab3c27df848030b7b46e69d34b7d192
    container_name: doctalk-minio
    # Volumes written by the old image are root-owned. Started as root, the
    # entrypoint chowns the data dir, then runs the server as its own
    # `minio` user; the default uid 1001 fails with "Permission denied".
    user: root
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console
    volumes:
      - minio_data:/bitnami/minio/data

volumes:
  pg_data:
  qdrant_data:
  redis_data:
  minio_data:

